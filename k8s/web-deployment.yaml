apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web-server

  template:
    metadata:
      labels:
        app: web-server

    spec:
      containers:
        - name: web-server

          image:   898865654957.dkr.ecr.ap-south-1.amazonaws.com/webapp:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 80
